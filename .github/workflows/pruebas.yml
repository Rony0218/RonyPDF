name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo lectura: las pruebas no pueden escribir en el repositorio, ni siquiera las de una solicitud externa.
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest
      - name: Ejecutar pruebas (lógica PDF e interfaz sin pantalla)
        run: python -m pytest -q

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>RonyPDF 2.0 · video con voz</title>
<!--
  Video de RonyPDF 2.0 con voz, hecho con HTML y una línea de tiempo determinista.
  index.html?f=reel  → 1080 × 1920 (Instagram, TikTok, Shorts)
  index.html?f=feed  → 1080 × 1350 (LinkedIn)
  index.html?f=reel&portada → la portada del reel (una imagen fija)
  Sin ?render se reproduce en el navegador, sin sonido (espacio = pausa, flechas = ±1 s, barra para buscar).
  Con ?render, render.mjs llama a TL.seek(t) cuadro a cuadro y captura cada uno.
  Los tiempos salen de escenas.js (tiempos.py), que a su vez sale de la voz: no hay tiempos escritos a mano,
  todo se ancla a las palabras clave de cada línea (K(línea, "palabra")).
-->
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../ronypdf/assets/fonts/SpaceGrotesk-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Space Grotesk"; src: url("../ronypdf/assets/fonts/SpaceGrotesk-SemiBold.ttf"); font-weight: 600; }
  :root { --brand:#d7373a; --brand2:#be2c2f; --ink:#161a25; --ink2:#4a5266; --ink3:#6a7184; --canvas:#f4f5f9; --line:#e3e6ee;
          --dark:#0d0f15; --hl:#FFE14D; --ver:#7b5ce5; --org:#2e8bd8; --opt:#e5672f; --conv:#129c80; --edit:#d8437f;
          --seg:#4f63e0; --ok:#1e7b45; }
  html, body { margin:0; background:#18181B; }
  body { display:flex; flex-direction:column; align-items:center; }
  #stage { position:relative; overflow:hidden; background:var(--canvas); color:var(--ink);
           font-family:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
           transform-origin:0 0; -webkit-font-smoothing:antialiased; }
  .abs { position:absolute; left:0; top:0; }
  .scene { position:absolute; inset:0; display:none; }
  .g { font-family:"Space Grotesk","Segoe UI",sans-serif; font-weight:700; letter-spacing:-.02em; }
  .eyebrow { font-family:"Space Grotesk","Segoe UI",sans-serif; font-weight:700; letter-spacing:.16em; white-space:nowrap; }
  .title { font-family:"Space Grotesk","Segoe UI",sans-serif; font-weight:700; letter-spacing:-.03em; line-height:1.02; }
  .title span { display:inline-block; }
  .card { position:absolute; overflow:hidden; border-radius:30px; background:#fff;
          box-shadow:0 34px 80px rgba(22,26,37,.20), 0 4px 14px rgba(22,26,37,.08); }
  .card img.shot { position:absolute; left:0; top:0; width:2480px; height:1640px; transform-origin:0 0; }
  .chip { position:absolute; left:0; top:0; display:flex; align-items:center; gap:14px; background:#fff; color:var(--ink);
          border-radius:999px; font-weight:700; white-space:nowrap; box-shadow:0 14px 34px rgba(22,26,37,.16); }
  .ring { position:absolute; left:0; top:0; border-radius:18px; border:6px solid var(--brand); box-sizing:border-box;
          box-shadow:0 0 0 10px rgba(215,55,58,.16); z-index:5; }
  .tile { position:absolute; left:0; top:0; background:#fff; border-radius:30px; box-sizing:border-box; display:flex;
          align-items:center; gap:34px; box-shadow:0 18px 44px rgba(22,26,37,.12); }
  .ic { display:flex; align-items:center; justify-content:center; flex:none; }
  #sub { position:absolute; left:0; top:0; display:flex; flex-wrap:wrap; justify-content:center; align-content:center;
         column-gap:.24em; padding:16px 30px 18px; border-radius:26px; background:rgba(14,16,22,.86); color:#fff;
         font-family:"Space Grotesk","Segoe UI",sans-serif; font-weight:700; line-height:1.2; box-sizing:border-box;
         text-align:center; box-shadow:0 18px 40px rgba(0,0,0,.22); }
  #sub span { display:inline-block; border-radius:12px; padding:0 .1em; }
  #sub span.on { background:var(--hl); color:var(--ink); }
  #ui { color:#ddd; font:14px "Segoe UI"; margin:10px; display:flex; gap:12px; align-items:center; }
  #ui input { width:600px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"></div>
<script src="escenas.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const RENDER = Q.has("render"), PORTADA = Q.has("portada");
const F = Q.get("f") === "feed" ? "feed" : "reel";
const R = F === "reel";
const W = 1080, H = R ? 1920 : 1350;
const ES = window.ESCENAS, DUR = ES.duracion, LINES = ES.lineas, SUBS = ES.subtitulos, DATOS = ES.datos || {};
const SC = Object.fromEntries(ES.escenas.map(s => [s.id, s]));
const REV = ES.revelacion;
const K = (k, w, d = 0) => ((LINES[k - 1].claves || {})[w] ?? LINES[k - 1].desde) + d;   // tiempo de una palabra clave
const LD = k => LINES[k - 1].desde, LH = k => LINES[k - 1].hasta;
const CAP = "capturas/", IC = "capturas/iconos/";
const A = window.AUTOR || {};

// Medidas de cada formato. En el vertical se respeta lo que tapan los botones de la red social: nada importante
// arriba de y≈170, debajo de y≈1650 ni en la esquina x>960 con y>1100. Los subtítulos van centrados, más angostos.
const L = R ? {
  brandY: 200, eyeY: 268, eyeSize: 30, titleY: 306, titleSize: 80,
  card: { x: 60, y: 548, w: 960, h: 780 }, mid: 820, hs: 1,
  subY: 1478, subW: 820, subSize: 60,
} : {
  brandY: 56, eyeY: 108, eyeSize: 26, titleY: 142, titleSize: 62,
  card: { x: 60, y: 322, w: 960, h: 770 }, mid: 600, hs: 0.82,
  subY: 1216, subW: 940, subSize: 50,
};

// ---------------------------------------------------------------- utilidades
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: t => t,
  out: t => 1 - Math.pow(1 - t, 3),
  out5: t => 1 - Math.pow(1 - t, 5),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  in: t => t * t * t,
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
};
const P = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };   // azar fijo
const stage = document.getElementById("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";

function el(tag, cls, parent, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  (parent || stage).appendChild(n);
  return n;
}
function css(n, o) { Object.assign(n.style, o); return n; }
function tf(n, { x = 0, y = 0, s = 1, r = 0, o = 1 } = {}) {
  n.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
  n.style.opacity = o;
}
const IMGS = [];
function img(src, cls, parent) {
  const i = el("img", cls, parent);
  i.src = src; i.decoding = "sync"; IMGS.push(i);
  return i;
}
const miles = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const tamano = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : (b / 1024).toFixed(1).replace(".", ",") + " KB";
const show = (n, on) => { n.style.display = on ? "" : "none"; };

// íconos (trazos simples, sin marcas de terceros)
const SVG = {
  laptop: c => `<svg viewBox="0 0 120 80" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="3.2" stroke-linejoin="round"><rect x="18" y="6" width="84" height="54" rx="6"/><path d="M6 66h108l-6 8H12z" fill="${c}" fill-opacity=".18"/><rect x="24" y="12" width="72" height="42" rx="2" fill="${c}" fill-opacity=".08" stroke-width="0"/></svg>`,
  cloud: c => `<svg viewBox="0 0 120 80" width="100%" height="100%" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="3.2" stroke-linejoin="round"><path d="M32 70h58a20 20 0 0 0 2-40 28 28 0 0 0-53-6A22 22 0 0 0 32 70z"/></svg>`,
  globe: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 2.6 15.2 0 18M12 3c-2.6 2.8-2.6 15.2 0 18"/></svg>`,
  skull: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.8c-4.6 0-8 3.3-8 7.6 0 2.5 1.1 4.2 2.6 5.2V19h2.2v-1.6h1.6V19h3.2v-1.6h1.6V19h2.2v-3.4c1.5-1 2.6-2.7 2.6-5.2 0-4.3-3.4-7.6-8-7.6z"/><circle cx="8.8" cy="10.6" r="1.9" fill="${c}"/><circle cx="15.2" cy="10.6" r="1.9" fill="${c}"/><path d="M12 13.2l-1 2h2z" fill="${c}"/></svg>`,
  warn: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.5l9.5 16.5h-19z" fill="${c}" fill-opacity=".15"/><path d="M12 10v4.6M12 17.4v.1"/></svg>`,
  receipt: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></svg>`,
  upload: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8"/><path d="M12 12v8M9 15l3-3 3 3"/></svg>`,
  sparkle: c => `<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 1.5c.9 5.6 4.9 9.6 10.5 10.5-5.6.9-9.6 4.9-10.5 10.5C11.1 16.9 7.1 12.9 1.5 12 7.1 11.1 11.1 7.1 12 1.5z" fill="${c}"/></svg>`,
  clock: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="1.8"><circle cx="12" cy="12" r="9.2"/></svg>`,
  wifioff: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M2.5 8.8a14 14 0 0 1 19 0M5.6 12.2a9.6 9.6 0 0 1 12.8 0M8.8 15.5a5 5 0 0 1 6.4 0"/><circle cx="12" cy="19" r="1.1" fill="${c}"/><path d="M3.5 3.5l17 17" stroke-width="2.4"/></svg>`,
  lock: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></svg>`,
  code: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5M13.5 4.5l-3 15"/></svg>`,
  check: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>`,
  search: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>`,
  copy: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></svg>`,
  cursor: '<svg width="54" height="54" viewBox="0 0 24 24"><path d="M4 2.5l15 9.2-6.6 1.4 3.9 7.1-2.7 1.4-3.8-7.1L4.9 19z" fill="#111827" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  heart: '<svg viewBox="0 0 24 24" width="100%" height="100%"><defs><linearGradient id="gh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f06292"/><stop offset="1" stop-color="#d7373a"/></linearGradient></defs><path d="M12 21s-7.8-4.9-9.6-10A5.5 5.5 0 0 1 12 5.6 5.5 5.5 0 0 1 21.6 11c-1.8 5.1-9.6 10-9.6 10z" fill="url(#gh)"/></svg>',
  arrowDown: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M6 13l6 6 6-6"/></svg>`,
  arrowRight: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M14 6l6 6-6 6"/></svg>`,
  zip: '<svg viewBox="0 0 64 80" width="100%" height="100%"><path d="M6 4h36l16 16v54a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fff" stroke="#c5cad6" stroke-width="2.4"/><path d="M42 4v16h16" fill="#eceef4" stroke="#c5cad6" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 8h6v4h-6zM30 12h6v4h-6zM24 16h6v4h-6zM30 20h6v4h-6zM24 24h6v4h-6z" fill="#6a7184"/><rect x="22" y="30" width="16" height="14" rx="3" fill="#6a7184"/><rect x="10" y="52" width="44" height="16" rx="4" fill="#e5672f"/><text x="32" y="64.5" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="12" fill="#fff">ZIP</text></svg>',
  user: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>`,
  camera: c => `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="1.9"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/></svg>`,
};

// ---------------------------------------------------------------- fondo, barra de progreso, marca y cortinillas
const bgDark = css(el("div", "abs"), { width: W + "px", height: H + "px", background: "#0d0f15" });
const glowA = css(el("div", "abs"), { width: "1400px", height: "1400px", borderRadius: "50%" });
const glowB = css(el("div", "abs"), { width: "1200px", height: "1200px", borderRadius: "50%" });
const dots = css(el("div", "abs"), { width: W + "px", height: H + "px", backgroundSize: "36px 36px" });
const world = css(el("div", "abs"), { width: W + "px", height: H + "px" });       // todo lo que tiembla
const bar = css(el("div", "abs"), { height: "8px", background: "var(--brand)", top: "0px", zIndex: 30 });

const brand = css(el("div", "abs", world), { display: "flex", alignItems: "center", gap: "16px", left: "60px", top: (L.brandY - 30) + "px", zIndex: 5 });
css(img(IC + "logo.png", "", brand), { width: "60px", height: "60px" });
css(el("div", "g", brand, 'Rony<span style="color:var(--brand)">PDF</span>'), { fontSize: "38px" });
css(el("div", "g", brand, A.version || "2.0"), { fontSize: "24px", color: "#fff", background: "var(--ink)", borderRadius: "10px", padding: "2px 10px" });

const wipe = css(el("div", "abs"), { width: (W * 1.9) + "px", height: (H * 1.5) + "px", zIndex: 20, top: (-H * 0.25) + "px" });
const flash = css(el("div", "abs"), { width: W + "px", height: H + "px", background: "#fff", zIndex: 21, opacity: 0 });

// color de acento y tema de cada escena
const ACC = { nube: "#2e8bd8", licencia: "#e5672f", pirata: "#d7373a", era: "#7b5ce5", tokens: "#7b5ce5", offline: "#1e7b45",
  gratis: "#d7373a", editar: "#7b5ce5", organizar: "#2e8bd8", ocr: "#129c80", convertir: "#129c80", censurar: "#4f63e0",
  mas: "#d8437f", paleta: "#d7373a", instalar: "#2e8bd8", cierre: "#d8437f", final: "#d7373a" };
const OSCURAS = new Set(["nube", "licencia", "pirata", "era", "tokens"]);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

// ---------------------------------------------------------------- piezas comunes de las escenas claras
function titulo(root, eyebrow, title, color) {
  const eye = css(el("div", "abs eyebrow", root, eyebrow), { left: "62px", top: L.eyeY + "px", fontSize: L.eyeSize + "px", color });
  const ttl = css(el("div", "abs title", root), { left: "58px", top: L.titleY + "px", width: (W - 116) + "px", fontSize: L.titleSize + "px" });
  ttl.innerHTML = title.split("<br>").map(l => l.split(" ").map(w => `<span>${w}</span>`).join(" ")).join("<br>");
  return { eye, ttl, words: [...ttl.querySelectorAll("span")] };
}
function entraTitulo(T, t, a) {
  const pe = P(t, a, a + 0.4);
  tf(T.eye, { x: (1 - pe) * -30, o: pe });
  T.words.forEach((w, i) => { const p = P(t, a + 0.06 + i * 0.05, a + 0.42 + i * 0.05, E.back); tf(w, { y: (1 - p) * 46, o: clamp(p * 1.4) }); });
}
function tarjeta(root, src, extra = {}) {
  const c = css(el("div", "card", root), { left: L.card.x + "px", top: L.card.y + "px", width: L.card.w + "px", height: L.card.h + "px", ...extra });
  const shots = (Array.isArray(src) ? src : [src]).map(s => img(CAP + s + ".png", "shot", c));
  return { c, shots };
}
function entraTarjeta(n, t, a) {
  const p = P(t, a + 0.04, a + 0.6, E.out5);
  tf(n, { y: (1 - p) * 160, s: 0.92 + 0.08 * p, o: clamp(p * 1.8) });
}
// Cámara sobre una captura de 2480 × 1640: [t, x, y, escala] (centro en píxeles de la captura)
function camAt(t, keys) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) { const p = E.inOut((t - a[0]) / Math.max(1e-3, b[0] - a[0])); return [lerp(a[1], b[1], p), lerp(a[2], b[2], p), lerp(a[3], b[3], p)]; }
  }
  return keys[keys.length - 1].slice(1);
}
function aim(cam, cw = L.card.w, ch = L.card.h) {
  let [x, y, s] = cam;
  s = Math.max(s, cw / 2480, ch / 1640);
  const hx = cw / 2 / s, hy = ch / 2 / s;
  return { x: clamp(x, hx, 2480 - hx), y: clamp(y, hy, 1640 - hy), s, cw, ch };
}
function shoot(n, c) { n.style.transform = `translate(${c.cw / 2 - c.x * c.s}px,${c.ch / 2 - c.y * c.s}px) scale(${c.s})`; }
const toCard = (c, px, py) => [c.cw / 2 + (px - c.x) * c.s, c.ch / 2 + (py - c.y) * c.s];
// muestra una sola de varias capturas con un fundido corto: estados = [[t, índice], …]
function estados(shots, t, cambios, fundido = 0.16) {
  let cur = cambios[0][1], prev = cur, tc = -1;
  for (const [tt, i] of cambios) if (t >= tt) { prev = cur; cur = i; tc = tt; }
  const p = tc < 0 ? 1 : P(t, tc, tc + fundido, E.lin);
  shots.forEach((s, i) => { s.style.opacity = i === cur ? 1 : (i === prev ? 1 - p : 0); s.style.zIndex = i === cur ? 2 : 1; });
  return cur;
}
function anillo(parent, color = "var(--brand)") { const r = el("div", "ring", parent); r.style.borderColor = color; r.style.boxShadow = `0 0 0 10px ${rgba(color.startsWith("#") ? color : "#d7373a", .18)}`; return r; }
function ponAnillo(r, c, x0, y0, x1, y1, p, pad = 10) {
  const [a, b] = toCard(c, x0, y0), [d, e] = toCard(c, x1, y1);
  css(r, { width: (d - a + 2 * pad) + "px", height: (e - b + 2 * pad) + "px" });
  tf(r, { x: a - pad, y: b - pad, s: 1.25 - 0.25 * E.back(clamp(p)), o: clamp(p * 2.5) });
}
function chip(parent, html, size, color = "var(--ink)", bg = "#fff") {
  return css(el("div", "chip", parent, html), { fontSize: size + "px", padding: `${size * 0.42}px ${size * 0.8}px ${size * 0.42}px ${size * 0.55}px`, color, background: bg });
}
function icono(key, px) { return `<img src="${IC}${key}.png" style="width:${px}px;height:${px}px;display:block">`; }
const svgBox = (svg, px, extra = "") => `<span class="ic" style="width:${px}px;height:${px}px;${extra}">${svg}</span>`;
function popIn(n, t, a, { x = 0, y = 0, d = 0.38, s0 = 0.5, dy = 0, r = 0 } = {}) {
  const p = P(t, a, a + d, E.back);

  css(glowB, { background: `radial-gradient(circle, ${rgba(oscuro ? "#4f63e0" : "#161a25", oscuro ? .22 : .07)} 0%, rgba(0,0,0,0) 60%)`, transform: `translate(${W - 640 + Math.cos(t * 0.27) * 140}px,${H - 760 + Math.sin(t * 0.21) * 160}px)` });

    if (on) upd(t);
  }
  // cortinilla de color en cada corte (en el gancho, un destello corto); en la revelación, destello blanco
  let wp = -1, wc = "#fff";
  for (let i = 0; i < CORTES.length; i++) {
    const c = CORTES[i], id = ES.escenas[i + 1].id;
    if (t > c - 0.2 && t < c + 0.2 && !["licencia", "pirata", "offline"].includes(id)) { wp = P(t, c - 0.2, c + 0.2, E.inOut); wc = ACC[id]; }
  }
  if (wp >= 0) { wipe.style.display = "block"; wipe.style.background = wc; wipe.style.transform = `translateX(${lerp(W + 60, -W * 1.95, wp)}px) skewX(-14deg)`; }
  else wipe.style.display = "none";
  let fo = 0;
  for (const c of [SC.licencia.desde, SC.pirata.desde]) if (t > c - 0.04 && t < c + 0.16) fo = Math.max(fo, 0.55 * (1 - P(t, c - 0.04, c + 0.16)));
  if (t >= REV && t < REV + 0.4) fo = Math.max(fo, 0.85 * (1 - P(t, REV, REV + 0.4)));   // destello, sin cuadro en blanco
  if (t >= SC.offline.desde && t < SC.offline.desde + 0.25) fo = Math.max(fo, 0.5 * (1 - P(t, SC.offline.desde, SC.offline.desde + 0.25)));
  flash.style.opacity = fo;
  updSub(t);
}

// ================================================================ portada del reel (imagen fija)
function portada() {
  for (const [, root] of ESC) root.style.display = "none";
  bgDark.style.opacity = 0; bar.style.display = "none"; sub.style.display = "none"; wipe.style.display = "none";
  css(glowA, { background: `radial-gradient(circle, rgba(215,55,58,.20) 0%, rgba(215,55,58,0) 62%)`, transform: "translate(-260px,-200px)" });
  css(glowB, { background: `radial-gradient(circle, rgba(79,99,224,.16) 0%, rgba(0,0,0,0) 60%)`, transform: `translate(${W - 700}px,${H - 900}px)` });
  dots.style.backgroundImage = "radial-gradient(rgba(22,26,37,.07) 1.7px, transparent 1.8px)";
  tf(brand, { o: 0 });
  const p = css(el("div", "abs", stage), { width: W + "px", height: H + "px", zIndex: 40 });
  const top = R ? 300 : 70;
  p.innerHTML = `<div style="position:absolute;left:0;width:${W}px;top:${top}px;display:flex;flex-direction:column;align-items:center;gap:26px">` +
    `<div style="display:flex;align-items:center;gap:22px"><img src="${IC}logo.png" style="width:120px;height:120px;filter:drop-shadow(0 16px 30px rgba(215,55,58,.35))"><span class="title" style="font-size:96px">Rony<span style="color:var(--brand)">PDF</span></span><span class="g" style="font-size:60px;color:#fff;background:var(--ink);border-radius:16px;padding:2px 18px">${A.version || "2.0"}</span></div>` +
    `<div class="title" style="font-size:${R ? 128 : 104}px;text-align:center;margin-top:30px">Tus PDF,<br><span style="background:var(--hl);border-radius:20px;padding:0 18px">sin internet</span></div>` +
    `<div class="g" style="font-size:44px;color:var(--ink2);margin-top:6px">Gratis · Código abierto · Portátil</div></div>`;
  const cw = R ? 940 : 900, ch = R ? 640 : 520;
  const c = css(el("div", "card", p), { left: ((W - cw) / 2) + "px", top: (R ? 930 : 700) + "px", width: cw + "px", height: ch + "px", transform: "rotate(-3deg)" });
  const s = img(CAP + "censurar-2.png", "shot", c);
  const sello = css(el("div", "abs g", p, "26 herramientas"), { left: (R ? 640 : 680) + "px", top: (R ? 880 : 660) + "px", fontSize: "52px", color: "#fff", background: "var(--ok)", borderRadius: "999px", padding: "12px 34px", transform: "rotate(8deg)", boxShadow: "0 16px 34px rgba(30,123,69,.35)", zIndex: 2 });
  return s.decode().then(() => shoot(s, aim([1180, 800, 0.62], cw, ch)));
}

const ready = Promise.all([document.fonts.load('700 40px "Space Grotesk"'), document.fonts.load('600 40px "Space Grotesk"'), document.fonts.ready,
  ...IMGS.map(i => i.decode().catch(() => console.error("No cargó " + i.src)))])
  .then(() => (PORTADA ? portada() : seek(0))).then(() => true);
window.TL = { ready, seek, duration: DUR, width: W, height: H };

// ---------------------------------------------------------------- vista previa en el navegador
if (!RENDER && !PORTADA) {
  const fit = () => { const s = Math.min((innerHeight - 60) / H, (innerWidth - 20) / W); stage.style.transform = `scale(${s})`; stage.style.marginBottom = `${-(1 - s) * H}px`; stage.style.marginRight = `${-(1 - s) * W}px`; };
  addEventListener("resize", fit); fit();
  const ui = document.getElementById("ui");
  const range = el("input", "", ui); range.type = "range"; range.min = 0; range.max = DUR; range.step = 0.01;
  const lab = el("span", "", ui);
  let t0 = performance.now(), playing = true, cur = 0;
  range.oninput = () => { cur = +range.value; t0 = performance.now() - cur * 1000; seek(cur); };
  addEventListener("keydown", e => {
    if (e.code === "Space") { playing = !playing; t0 = performance.now() - cur * 1000; }
    if (e.code === "ArrowRight" || e.code === "ArrowLeft") { cur = clamp(cur + (e.code === "ArrowRight" ? 1 : -1), 0, DUR); t0 = performance.now() - cur * 1000; seek(cur); }
  });
  ready.then(() => {
    const loop = now => {
      if (playing) { cur = ((now - t0) / 1000) % DUR; seek(cur); range.value = cur; }
      lab.textContent = cur.toFixed(2) + " s · " + F;
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
</script>
